[workspace]
authors = ["Seth Stadick <Seth_Stadick+biorad@bio-rad.com>"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76"

[package]
name = "ziprs"
version = "0.1.0"
publish = true

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }
[package.build.config.pkg]
name = "ziprs"
path = "ziprs"

[package.host-dependencies]
mojo-compiler = "=1.0.0"

[package.build-dependencies]
mojo-compiler = "=1.0.0"
"ziprs-rust-mojo-bindings" = { path = "vendor/rust-bindings" }

[package.run-dependencies]
mojo-compiler = "=1.0.0"
"ziprs-rust-mojo-bindings" = { path = "vendor/rust-bindings" }

[tasks]
# Library projects do not define a run task.
t = { cmd = "sh -c 'find ./tests -name test_*.mojo | xargs -I % mojo run -I . -D ASSERT=all %'" }
check-generated = "python scripts/check_generated.py"
format = "mojo format --line-length 100 ziprs tests examples ci/git-consumer/ziprs_ci_consumer ci/git-consumer/tests"

[target.linux-64.tasks]
# Mojo 1.0 may select AVX-512 on CI runners whose hosts do not expose it.
t = { cmd = "sh -c 'find ./tests -name test_*.mojo | xargs -I % mojo run --target-features=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq,-avx512fp16,-avx512bf16 -I . -D ASSERT=all %'" }

[dependencies]
mojo = "=1.0.0"
ziprs = { path = "." }
"ziprs-rust-mojo-bindings" = { path = "vendor/rust-bindings" }
