# Input files as generated by `mojo doc`.
input:
  - docs/src

# Mojo source packages monitored in watch mode.
source:
  - ziprs

# Source links attached to generated API entries.
source-url:
  ziprs: https://github.com/ExtraMojo/zipprs-llm/blob/main/ziprs

output: docs/site/content
tests: ""
format: hugo
exports: false
short-links: true
report-missing: true
strict: false
dry-run: false
case-insensitive: false
templates: [docs/templates]

pre-run:
  - |
    echo "Running 'mojo doc'..."
    pixi run mojo doc -o docs/src/ziprs.json ziprs
    echo "Done."

pre-build: []
pre-test: []
post-test: []
post-build: []
post-run: []
