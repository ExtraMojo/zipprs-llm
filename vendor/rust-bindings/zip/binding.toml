chosen_by = "user"

[[adaptations]]
export = "compression.type"
rust = "zip::CompressionMethod"
mojo = "Compression"
kind = "fieldless-write-subset"
effect = "Exposes only Stored and Deflated for writing; entry metadata still reports every method by numeric ZIP code and name."
chosen_by = "user"

[[adaptations]]
export = "archive.open"
rust = "zip::ZipArchive<std::io::Cursor<Vec<u8>>>::new"
mojo = "Archive.open"
kind = "copied-byte-input-with-dynamic-result"
effect = "Copies the caller's archive bytes into a Rust-owned seekable cursor and preserves parse errors as dynamic messages."
chosen_by = "user"

[[adaptations]]
export = "archive.entry"
rust = "zip::ZipArchive<std::io::Cursor<Vec<u8>>>::by_index"
mojo = "Archive.entry"
kind = "owned-metadata-snapshot"
effect = "Copies entry metadata into an independent opaque owner so no borrowed ZipFile lifetime crosses the ABI."
chosen_by = "user"

[[adaptations]]
export = "archive.read"
rust = "std::io::Read::read_to_end(zip::read::ZipFile)"
mojo = "Archive.read_entry"
kind = "whole-entry-materialization"
effect = "Decompresses the selected entry into a Rust-owned byte buffer instead of exposing a streaming Rust reader."
chosen_by = "user"

[[adaptations]]
export = "archive.read-into"
rust = "std::io::Read::read_exact(zip::read::ZipFile)"
mojo = "Archive.read_into"
kind = "caller-owned-exact-buffer"
effect = "Decompresses directly into a caller-owned mutable span whose length must equal the declared entry size."
chosen_by = "user"

[[adaptations]]
export = "archive.comment"
rust = "zip::ZipArchive<std::io::Cursor<Vec<u8>>>::comment"
mojo = "Archive.comment"
kind = "owned-byte-copy"
effect = "Copies the borrowed raw archive comment into an independent ZipBytes owner."
chosen_by = "user"

[[adaptations]]
export = "entry.type"
rust = "zip::read::ZipFile<'a, std::io::Cursor<Vec<u8>>>"
mojo = "Entry"
kind = "owned-metadata-snapshot"
effect = "The exposed Entry owns copied metadata and has no borrow relationship with its Archive."
chosen_by = "user"

[[adaptations]]
export = "bytes.type"
rust = "Vec<u8>"
mojo = "ZipBytes"
kind = "opaque-owned-byte-buffer"
effect = "Keeps the owned collection behind Rust and exposes length plus bulk fill rather than a by-value slice carrier."
chosen_by = "user"

[[adaptations]]
export = "writer.add-file"
rust = "zip::ZipWriter<std::io::Cursor<Vec<u8>>>::start_file + std::io::Write::write_all"
mojo = "ZipWriter.add_file"
kind = "whole-file-write"
effect = "Combines file start and complete payload write into one fallible call over a borrowed Mojo byte span."
chosen_by = "user"

[[adaptations]]
export = "writer.add-directory"
rust = "zip::ZipWriter<std::io::Cursor<Vec<u8>>>::add_directory"
mojo = "ZipWriter.add_directory"
kind = "utf8-path-input"
effect = "Accepts a Mojo UTF-8 string and uses Stored options for the directory entry."
chosen_by = "user"

[[adaptations]]
export = "writer.set-comment"
rust = "zip::ZipWriter<std::io::Cursor<Vec<u8>>>::set_comment"
mojo = "ZipWriter.set_comment"
kind = "utf8-comment-input"
effect = "Exposes the upstream UTF-8 archive comment operation as a fallible Mojo method."
chosen_by = "user"

[[adaptations]]
export = "writer.finish"
rust = "zip::ZipWriter<std::io::Cursor<Vec<u8>>>::finish"
mojo = "ZipWriter.finish"
kind = "single-shot-owned-byte-result"
effect = "Consumes the internal writer state once and returns the completed archive as ZipBytes with dynamic errors."
chosen_by = "user"

