  "archive.type",
  "archive.open",
  "archive.len",
  "archive.is-empty",
  "archive.index-for-name",
  "archive.entry",
  "archive.read",
  "archive.read-into",
  "archive.comment",
]
chosen_by = "user"

[[specializations]]
