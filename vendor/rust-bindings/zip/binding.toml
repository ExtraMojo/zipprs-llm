schema_version = 1

[binding]
id = "zip"
mojo_package = "ziprs_native"
symbol_prefix = "rust_mojo__zip__"

[crate]
name = "zip"
version = "=8.6.0"
source_kind = "registry"
features = ["deflate-flate2-zlib-rs"]
default_features = false
checksum = "2d04a6b5381502aa6087c94c669499eb1602eb9c5e8198e534de571f7154809b"

[ffi]
crate_name = "ziprs_zip_ffi"
cargo_manifest = "ffi/Cargo.toml"
tests = ["ffi/tests/bridge.rs"]

[mojo]
source_dir = "mojo/ziprs_native"
tests = ["tests/smoke.mojo"]

[pixi]
build_dependencies = []
host_dependencies = []
run_dependencies = []

[scope]
requested = [
  "Byte-oriented ZipArchive open, metadata, lookup, entry read, and bulk read",
  "In-memory ZipWriter construction, file/directory insertion, comment, and finish",
  "Stored and Deflate compression through deflate-flate2-zlib-rs",
]
trait_policy = "Only Read and Write behavior needed by the approved whole-entry byte API is adapted; Rust I/O traits are not themselves exposed."
audited_exports = [
  "compression.type",
  "archive.type",
  "archive.open",
  "archive.len",
  "archive.is-empty",
  "archive.index-for-name",
  "archive.entry",
  "archive.read",
  "archive.read-into",
  "archive.comment",
  "entry.type",
  "entry.name",
  "entry.enclosed-name",
  "entry.comment",
  "entry.compressed-size",
  "entry.size",
  "entry.crc32",
  "entry.compression-code",
  "entry.compression-name",
  "entry.is-dir",
  "entry.is-file",
  "entry.is-symlink",
  "entry.unix-mode",
  "bytes.type",
  "bytes.len",
  "bytes.fill",
  "writer.type",
  "writer.new",
  "writer.is-finished",
  "writer.add-file",
  "writer.add-directory",
  "writer.set-comment",
  "writer.finish",
  "archive-result.type",
  "archive-result.is-ok",
  "archive-result.error",
  "archive-result.take",
  "entry-result.type",
  "entry-result.is-ok",
  "entry-result.error",
  "entry-result.take",
  "bytes-result.type",
  "bytes-result.is-ok",
  "bytes-result.error",
  "bytes-result.take",
  "unit-result.type",
  "unit-result.is-ok",
  "unit-result.error",
  "count-result.type",
  "count-result.is-ok",
  "count-result.value",
  "count-result.error",
  "deferred.filesystem-extraction",
  "deferred.streaming-read",
  "deferred.streaming-write",
  "deferred.encryption",
  "deferred.additional-codecs",
  "deferred.append-and-copy",
  "deferred.extra-fields",
  "deferred.unstable",
  "deferred.unrequested-traits",
]

[tools]
generator_version = "0.1.0"
abi_backend_version = "0.1.0"
diplomat_version = "0.16.1"
diplomat_core_version = "0.16.1"
diplomat_runtime_version = "0.16.0"
mojo_version = "1.0.0"

[[specializations]]
rust_type = "zip::ZipArchive<R>"
mojo_name = "Archive"
parameters = { R = "std::io::Cursor<Vec<u8>>" }
