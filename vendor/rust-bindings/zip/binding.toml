parameters = { W = "std::io::Cursor<Vec<u8>>" }
exports = [
  "writer.type",
  "writer.new",
  "writer.is-finished",
  "writer.add-file",
  "writer.add-directory",
  "writer.set-comment",
  "writer.finish",
]
chosen_by = "user"

